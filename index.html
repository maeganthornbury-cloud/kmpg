<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goalie Save & Goal Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --danger: #ef4444;
      --line: #374151;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #020617, var(--bg));
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
    }

    h1, h2 { margin: 0 0 14px; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1rem; color: var(--muted); }

    .row {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    label { font-size: 0.85rem; color: var(--muted); }

    input, select {
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary { background: var(--accent); color: #052e16; }
    .secondary { background: #334155; color: #e2e8f0; }
    .danger { background: var(--danger); color: #fff; }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      background: #0b1222;
    }

    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #1e293b;
      font-size: 0.9rem;
    }

    th { color: #cbd5e1; background: #0b1326; }

    .summary-grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .summary-item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }

    .summary-item .k { color: var(--muted); font-size: 0.8rem; }
    .summary-item .v { font-size: 1.2rem; font-weight: 700; margin-top: 3px; }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 960px) {
      .app { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>Goalie Tracker</h1>
      <h2>Track saves and goals allowed by game</h2>

      <div class="row">
        <label for="date">Game Date</label>
        <input type="date" id="date" />
      </div>

      <div class="row">
        <label for="opponent">Opponent</label>
        <input type="text" id="opponent" placeholder="e.g. Central High" />
      </div>

      <div class="row">
        <label for="level">Team Level</label>
        <select id="level">
          <option value="Club">Club</option>
          <option value="JV">JV</option>
          <option value="Varsity">Varsity</option>
        </select>
      </div>

      <div class="row">
        <label for="saves">Saves</label>
        <input type="number" id="saves" min="0" value="0" />
      </div>

      <div class="row">
        <label for="goals">Goals Allowed</label>
        <input type="number" id="goals" min="0" value="0" />
      </div>

      <div class="row">
        <label for="season">Season</label>
        <input type="text" id="season" placeholder="e.g. 2026 Spring" />
      </div>

      <div class="button-row">
        <button class="primary" id="addBtn">Add Game</button>
        <button class="secondary" id="clearBtn">Clear Form</button>
      </div>
    </section>

    <section class="card">
      <h1>Game History</h1>

      <div class="button-row" style="margin-bottom: 12px;">
        <select id="seasonFilter" aria-label="Season Filter"></select>
        <select id="levelFilter" aria-label="Level Filter">
          <option value="All">All Levels</option>
          <option value="Club">Club</option>
          <option value="JV">JV</option>
          <option value="Varsity">Varsity</option>
        </select>
        <button class="danger" id="resetBtn">Reset All Data</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Opponent</th>
              <th>Level</th>
              <th>Season</th>
              <th>Saves</th>
              <th>Goals</th>
              <th>Save %</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div id="empty" class="empty">No games tracked yet.</div>

      <div class="summary-grid" id="summary"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'goalieTrackerGames';

    const form = {
      date: document.getElementById('date'),
      opponent: document.getElementById('opponent'),
      level: document.getElementById('level'),
      saves: document.getElementById('saves'),
      goals: document.getElementById('goals'),
      season: document.getElementById('season')
    };

    const rowsEl = document.getElementById('rows');
    const emptyEl = document.getElementById('empty');
    const summaryEl = document.getElementById('summary');
    const seasonFilter = document.getElementById('seasonFilter');
    const levelFilter = document.getElementById('levelFilter');

    let games = loadGames();

    function loadGames() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      try { return JSON.parse(raw); }
      catch { return []; }
    }

    function saveGames() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
    }

    function toPercent(saves, goals) {
      const shots = saves + goals;
      if (!shots) return '0.0%';
      return `${((saves / shots) * 100).toFixed(1)}%`;
    }

    function clearForm() {
      form.date.value = '';
      form.opponent.value = '';
      form.level.value = 'Club';
      form.saves.value = 0;
      form.goals.value = 0;
      form.season.value = '';
    }

    function getFilteredGames() {
      const s = seasonFilter.value;
      const l = levelFilter.value;
      return games.filter((g) => (s === 'All Seasons' || g.season === s) && (l === 'All' || g.level === l));
    }

    function renderFilters() {
      const seasons = [...new Set(games.map(g => g.season).filter(Boolean))].sort();
      const current = seasonFilter.value;

      seasonFilter.innerHTML = '<option>All Seasons</option>' + seasons.map(s => `<option>${s}</option>`).join('');

      if ([...seasonFilter.options].some(o => o.value === current)) {
        seasonFilter.value = current;
      }
    }

    function renderSummary(filtered) {
      const totals = filtered.reduce((acc, g) => {
        acc.games += 1;
        acc.saves += g.saves;
        acc.goals += g.goals;
        return acc;
      }, { games: 0, saves: 0, goals: 0 });

      summaryEl.innerHTML = `
        <div class="summary-item"><div class="k">Games</div><div class="v">${totals.games}</div></div>
        <div class="summary-item"><div class="k">Total Saves</div><div class="v">${totals.saves}</div></div>
        <div class="summary-item"><div class="k">Total Goals Allowed</div><div class="v">${totals.goals}</div></div>
        <div class="summary-item"><div class="k">Overall Save %</div><div class="v">${toPercent(totals.saves, totals.goals)}</div></div>
      `;
    }

    function render() {
      renderFilters();
      const filtered = getFilteredGames().sort((a, b) => (a.date < b.date ? 1 : -1));

      rowsEl.innerHTML = filtered.map((g) => `
        <tr>
          <td>${g.date || '-'}</td>
          <td>${g.opponent || '-'}</td>
          <td>${g.level}</td>
          <td>${g.season || '-'}</td>
          <td>${g.saves}</td>
          <td>${g.goals}</td>
          <td>${toPercent(g.saves, g.goals)}</td>
          <td><button class="danger" onclick="deleteGame('${g.id}')">Delete</button></td>
        </tr>
      `).join('');

      emptyEl.style.display = filtered.length ? 'none' : 'block';
      renderSummary(filtered);
      saveGames();
    }

    function addGame() {
      const entry = {
        id: crypto.randomUUID(),
        date: form.date.value,
        opponent: form.opponent.value.trim(),
        level: form.level.value,
        saves: Number(form.saves.value || 0),
        goals: Number(form.goals.value || 0),
        season: form.season.value.trim()
      };

      if (!entry.date) return alert('Please choose a game date.');
      if (!entry.season) return alert('Please enter a season (example: 2026 Spring).');
      if (entry.saves < 0 || entry.goals < 0) return alert('Saves and goals must be 0 or more.');

      games.push(entry);
      clearForm();
      render();
    }

    function deleteGame(id) {
      games = games.filter((g) => g.id !== id);
      render();
    }

    function resetAllData() {
      if (!confirm('Delete all tracked games?')) return;
      games = [];
      render();
    }

    window.deleteGame = deleteGame;

    document.getElementById('addBtn').addEventListener('click', addGame);
    document.getElementById('clearBtn').addEventListener('click', clearForm);
    document.getElementById('resetBtn').addEventListener('click', resetAllData);
    seasonFilter.addEventListener('change', render);
    levelFilter.addEventListener('change', render);

    render();
  </script>
</body>
</html>
